<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect - Bookmarks by Localforge</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .connect-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      width: 100%;
      max-width: 420px;
      margin: var(--space-4);
    }
    .connect-card h1 {
      margin: 0 0 var(--space-2) 0;
      font-size: var(--text-xl);
    }
    .connect-card p {
      margin: 0 0 var(--space-6) 0;
      color: var(--text-secondary);
      font-size: var(--text-sm);
    }
    .form-group {
      margin-bottom: var(--space-4);
    }
    .form-group label {
      display: block;
      margin-bottom: var(--space-1);
      font-size: var(--text-sm);
      font-weight: 500;
    }
    .form-group .input {
      width: 100%;
      box-sizing: border-box;
    }
    .token-row {
      display: flex;
      gap: var(--space-2);
    }
    .token-row .input {
      flex: 1;
    }
    .btn-row {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-6);
    }
    .btn-row .btn {
      flex: 1;
    }
    #connectStatus {
      margin-top: var(--space-4);
      font-size: var(--text-sm);
      text-align: center;
      min-height: 1.5em;
    }
    #connectStatus.error { color: var(--danger-text, #dc2626); }
    #connectStatus.success { color: var(--success-text, #16a34a); }
  </style>
</head>
<body>
  <div class="connect-card">
    <h1>Bookmarks by Localforge</h1>
    <p>Connect to your server to manage bookmarks.</p>

    <div class="form-group">
      <label for="serverUrlInput">Server URL</label>
      <input type="url" id="serverUrlInput" class="input" placeholder="https://your-server.example.com">
    </div>

    <div class="form-group">
      <label for="tokenInput">Auth Token</label>
      <div class="token-row">
        <input type="text" id="tokenInput" class="input" placeholder="Paste or generate a token">
        <button id="generateBtn" class="btn" type="button">Generate</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="connectBtn" class="btn btn-primary" type="button">Connect</button>
    </div>

    <div id="connectStatus"></div>
  </div>

  <script type="module" src="./connect.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks by Localforge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Bookmarks by Localforge</h1>
    </header>

    <main>
      <div id="status" class="status hidden"></div>

      <div class="actions">
        <button id="saveBtn" class="btn btn-save">
          <span class="icon">📌</span>
          Save This Page
        </button>

        <div class="search-row">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search bookmarks..."
          >
          <button id="searchBtn" class="search-btn" aria-label="Search">
            🔍
          </button>
        </div>
      </div>
    </main>

    <nav class="nav-bar">
      <button id="navLibrary" class="nav-btn">Library</button>
      <button id="navSearch" class="nav-btn">Search</button>
      <button id="navStumble" class="nav-btn">Stumble</button>
      <button id="navSettings" class="nav-btn">⚙️</button>
    </nav>
  </div>

  <script src="popup.ts" type="module"></script>
</body>
</html>

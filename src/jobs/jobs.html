<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline - Bookmarks by Localforge</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="icon" type="image/png" href="../../favicon.png">

</head>
<body class="layout">
  <header class="app-header">
    <nav class="app-header__nav">
      <a href="../library/library.html" class="app-header__nav-link">Library</a>
      <a href="../search/search.html" class="app-header__nav-link">Search</a>
      <a href="../stumble/stumble.html" class="app-header__nav-link">Stumble</a>
      <a href="../options/options.html" class="app-header__nav-link">Settings</a>
      <a href="../status/status.html" class="app-header__nav-link">Status</a>
    </nav>
    <div class="app-header__brand">
      <div id="healthIndicator"></div>
      <h1 class="app-header__title">Bookmarks by Localforge</h1>
    </div>
  </header>

  <div class="main-content">
    <main class="middle">
      <div class="jobs-page-content">
        <a href="../options/options.html#about" class="btn btn-secondary btn-back">
          &larr; Back to Settings
        </a>
        <div class="option-panel">
          <div class="option-panel__header">
            <h2>Jobs &amp; Pipeline</h2>
            <p class="section-description">
              Live view of bookmark processing stages, failures, and active batch jobs.
            </p>
          </div>

          <div class="option-panel__content">
            <div class="jobs-toolbar">
              <label class="jobs-auto-refresh">
                <input type="checkbox" id="autoRefreshToggle" checked />
                Auto-refresh
              </label>
              <span id="jobsLastUpdated" class="jobs-last-updated"></span>
              <button type="button" id="refreshJobsBtn" class="btn btn-secondary btn-sm">Refresh</button>
            </div>

            <section class="jobs-section">
              <h3 class="jobs-section__title">Pipeline</h3>
              <div id="pipelineColumns" class="pipeline-grid pipeline-grid--jobs">
                <div class="loading">Loading…</div>
              </div>
            </section>

            <section class="jobs-section">
              <div class="jobs-section__header">
                <h3 class="jobs-section__title">Failures <span id="failuresCount" class="jobs-section__count">(0)</span></h3>
                <button type="button" id="retryAllBtn" class="btn btn-secondary btn-sm">Retry all failed</button>
              </div>
              <div id="failuresList" class="failures-list">
                <div class="empty-state">No failures.</div>
              </div>
            </section>

            <section class="jobs-section">
              <h3 class="jobs-section__title">Active jobs</h3>
              <div id="activeJobsList" class="active-jobs-list">
                <div class="empty-state">No active jobs.</div>
              </div>
            </section>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="jobs.ts" type="module"></script>
</body>
</html>

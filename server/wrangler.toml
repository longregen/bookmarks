name = "bookmark-rag-server"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Map JSR imports (used by Deno) to npm packages (used by wrangler)
[alias]
"@hono/hono" = "hono"
"@hono/hono/cors" = "hono/cors"
"@hono/hono/logger" = "hono/logger"

# Environment variables (set via wrangler secret or dashboard)
# OPENAI_API_KEY - required for embeddings and Q&A generation
# CORS_ORIGIN - CORS allowed origin

[vars]
OPENAI_API_BASE = "https://api.openai.com/v1"
CHAT_MODEL = "gpt-4o-mini"
EMBEDDING_MODEL = "text-embedding-3-small"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "bookmark-rag"
database_id = "local"  # Use "local" for wrangler dev --local, replace with real ID for production

# Queue binding for bookmark processing
[[queues.producers]]
binding = "BOOKMARK_QUEUE"
queue = "bookmark-processing"

[[queues.consumers]]
queue = "bookmark-processing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "bookmark-processing-dlq"

# Development environment
[env.dev]
name = "bookmark-rag-server-dev"

[env.dev.vars]
CORS_ORIGIN = "*"
OPENAI_API_BASE = "https://api.openai.com/v1"
CHAT_MODEL = "gpt-4o-mini"
EMBEDDING_MODEL = "text-embedding-3-small"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "bookmark-rag"
database_id = "local"

[[env.dev.queues.producers]]
binding = "BOOKMARK_QUEUE"
queue = "bookmark-processing"

[[env.dev.queues.consumers]]
queue = "bookmark-processing"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "bookmark-processing-dlq"

# Production environment
[env.production]
name = "bookmark-rag-server"

# Set these via wrangler secret:
# wrangler secret put OPENAI_API_KEY --env production

name: Test Browser Extension
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

env:
  FIREFOX_VERSION: '145.0'
  GECKODRIVER_VERSION: '0.36.0'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox, web]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.browser }} extension
        run: npm run build:${{ matrix.browser }}

      - name: Upload ${{ matrix.browser }} build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.browser == 'web' && 'webapp' || format('extension-{0}', matrix.browser) }}
          path: dist-${{ matrix.browser }}/
          retention-days: 1

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  typecheck-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Type check Deno server
        run: cd server && deno check src/main.ts

      - name: Type check Worker entry point
        run: cd server && deno check src/worker.ts

  lint-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Firefox build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-firefox
          path: dist-firefox/

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Lint extension for Firefox
        run: web-ext lint -s dist-firefox --ignore-files "*.map"

      - name: Build Firefox extension package
        run: |
          cd dist-firefox
          web-ext build --overwrite-dest
          ls -la web-ext-artifacts/ || echo "No artifacts created"

      - name: Upload Firefox package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: firefox-extension-xpi
          path: dist-firefox/web-ext-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  test-e2e-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-chrome
          path: dist-chrome/

      - name: Cache Chromium
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/puppeteer
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium via Puppeteer
        run: npx @puppeteer/browsers install chromium@latest

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run E2E tests
        env:
          BROWSER_TYPE: chrome
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTENSION_PATH: dist-chrome
          SKIP_WRANGLER: '1'
        run: |
          CHROME_PATH=$(find chromium -name 'chrome' -type f | head -1)
          BROWSER_PATH="$CHROME_PATH" xvfb-run --auto-servernum npm run test:e2e:chrome

  test-e2e-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Install dependencies
        run: npm ci

      - name: Download Firefox build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-firefox
          path: dist-firefox/

      - name: Cache Firefox
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: cache-firefox
        with:
          path: ${{ runner.tool_cache }}/firefox
          key: firefox-${{ runner.os }}-${{ env.FIREFOX_VERSION }}

      - name: Install Firefox
        uses: browser-actions/setup-firefox@5914774dda97099441f02628f8d46411fcfbd208 # v1.7.0
        with:
          firefox-version: ${{ env.FIREFOX_VERSION }}
        id: setup-firefox

      - name: Install GeckoDriver
        run: |
          GECKODRIVER_URL="https://github.com/mozilla/geckodriver/releases/download/v${{ env.GECKODRIVER_VERSION }}/geckodriver-v${{ env.GECKODRIVER_VERSION }}-linux64.tar.gz"
          curl -sL "$GECKODRIVER_URL" | sudo tar xz -C /usr/local/bin
          geckodriver --version

      - name: Install xvfb and zip
        run: sudo apt-get update && sudo apt-get install -y xvfb zip

      - name: Run Firefox E2E tests with Selenium
        env:
          BROWSER_PATH: ${{ steps.setup-firefox.outputs.firefox-path }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXTENSION_PATH: dist-firefox
          SKIP_WRANGLER: '1'
        run: |
          echo "Running Firefox E2E tests with Selenium/GeckoDriver..."
          xvfb-run --auto-servernum npm run test:e2e:firefox

  test-e2e-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Install dependencies
        run: npm ci

      - name: Download Web build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webapp
          path: dist-web/

      - name: Cache Chromium
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/puppeteer
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium via Puppeteer
        run: npx @puppeteer/browsers install chromium@latest

      - name: Run Web E2E tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CHROME_PATH=$(find chromium -name 'chrome' -type f | head -1)
          BROWSER_PATH="$CHROME_PATH" npx tsx tests/e2e-web.test.ts

  test-e2e-server-sync-deno:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Install dependencies
        run: npm ci

      - name: Download Chrome build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-chrome
          path: dist-chrome/

      - name: Cache Chromium
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/puppeteer
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium via Puppeteer
        run: npx @puppeteer/browsers install chromium@latest

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Server Sync E2E tests (Deno)
        env:
          OPENAI_API_KEY: test-key-for-mock
          SKIP_WRANGLER: '1'
          SKIP_FIREFOX: '1'
        run: |
          CHROME_PATH=$(find chromium -name 'chrome' -type f | head -1)
          BROWSER_PATH="$CHROME_PATH" xvfb-run --auto-servernum npx tsx tests/e2e-walkthrough.test.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots-server-sync-deno
          path: screenshots/walkthrough/chrome-deno/
          retention-days: 7
          if-no-files-found: ignore

  test-e2e-server-sync-worker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Download Chrome build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: extension-chrome
          path: dist-chrome/

      - name: Cache Chromium
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/puppeteer
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium via Puppeteer
        run: npx @puppeteer/browsers install chromium@latest

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Server Sync E2E tests (Worker)
        env:
          OPENAI_API_KEY: test-key-for-mock
          SKIP_DENO: '1'
          SKIP_FIREFOX: '1'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          export PATH="$PWD/server/node_modules/.bin:$PATH"
          CHROME_PATH=$(find chromium -name 'chrome' -type f | head -1)
          BROWSER_PATH="$CHROME_PATH" xvfb-run --auto-servernum npx tsx tests/e2e-walkthrough.test.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: screenshots-server-sync-worker
          path: screenshots/walkthrough/chrome-wrangler/
          retention-days: 7
          if-no-files-found: ignore

  preview:
    needs: [build, test-e2e-chrome, test-e2e-firefox, test-e2e-web, test-e2e-server-sync-deno, test-e2e-server-sync-worker]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Download webapp artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webapp
          path: dist-web/

      - name: Add redirects
        run: |
          cat > dist-web/_redirects << 'EOF'
          / /src/library/library.html 302
          EOF

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist-web --project-name=bookmark-rag-preview --branch=pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const url = `https://pr-${context.issue.number}.bookmark-rag-preview.pages.dev`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Preview Deployment',
              '',
              `**URL:** ${url}`,
              '',
              `Built from ${context.sha.substring(0, 7)} | [E2E Screenshots](${runUrl}#artifacts)`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('### Preview Deployment'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Install Deno dependencies
        run: cd server && deno install

      - name: Run server tests
        run: cd server && deno task test

  nix-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox, server]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build ${{ matrix.target }} extension with Nix
        run: nix build .#${{ matrix.target }} --print-build-logs

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check --no-build

      - name: Verify dev shell
        run: nix develop --command echo "Dev shell OK"
